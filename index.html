<!DOCTYPE html>
<html lang="es" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bestiario - Coplas a las Criaturas de Venezuela</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond & Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        garamond: ['Cormorant Garamond', 'serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#070709',
                            velvet: '#0f0e13',
                            border: '#2a241e'
                        },
                        gold: {
                            light: '#f5e0a3',
                            DEFAULT: '#c8a458',
                            dark: '#8a6d2f'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Ultra dark mysterious background with subtle vignette */
        body {
            background: radial-gradient(circle at center, #131219 0%, #08070a 70%, #030304 100%);
            color: #d1c7b7;
            user-select: none;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            touch-action: manipulation;
        }

        /* Responsive height fix for mobile browsers */
        .app-viewport {
            height: 100vh;
            height: 100dvh;
        }

        /* 3D Stage & Page Container */
        .stage-3d {
            perspective: 2200px;
            perspective-origin: 50% 50%;
        }

        .book-page-container {
            transform-style: preserve-3d;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(0, 0, 0, 0.8), 0 0 1px rgba(200, 164, 88, 0.2);
            transition: box-shadow 0.3s ease;
            touch-action: none; /* Handled by zoom/drag logic when zoomed */
        }

        .book-page-container:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.98), 0 0 25px rgba(200, 164, 88, 0.15);
        }

        /* Zoom Container handling smooth transform */
        .zoom-layer {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Flipping animated page card */
        .flipping-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            z-index: 30;
            pointer-events: none;
        }

        /* Front and Back of the turning page */
        .flipping-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            overflow: hidden;
            background-color: #0d0c0e;
            border-radius: 6px;
        }

        .flipping-back {
            transform: rotateY(180deg);
        }

        /* Interactive Corner Hotspots */
        .corner-hotspot {
            position: absolute;
            width: 25%;
            height: 20%;
            max-width: 90px;
            max-height: 90px;
            z-index: 25;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Subtle golden corner curl effect on hover/touch */
        .corner-hotspot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .corner-br {
            bottom: 0;
            right: 0;
        }
        .corner-br::after {
            bottom: 0;
            right: 0;
            background: linear-gradient(135deg, transparent 50%, rgba(200, 164, 88, 0.3) 80%, rgba(245, 224, 163, 0.7) 100%);
            border-top-left-radius: 100%;
            box-shadow: -3px -3px 10px rgba(0,0,0,0.5);
        }

        .corner-bl {
            bottom: 0;
            left: 0;
        }
        .corner-bl::after {
            bottom: 0;
            left: 0;
            background: linear-gradient(225deg, transparent 50%, rgba(200, 164, 88, 0.3) 80%, rgba(245, 224, 163, 0.7) 100%);
            border-top-right-radius: 100%;
            box-shadow: 3px -3px 10px rgba(0,0,0,0.5);
        }

        .corner-tr {
            top: 0;
            right: 0;
        }
        .corner-tr::after {
            top: 0;
            right: 0;
            background: linear-gradient(45deg, transparent 50%, rgba(200, 164, 88, 0.3) 80%, rgba(245, 224, 163, 0.7) 100%);
            border-bottom-left-radius: 100%;
            box-shadow: -3px 3px 10px rgba(0,0,0,0.5);
        }

        .corner-tl {
            top: 0;
            left: 0;
        }
        .corner-tl::after {
            top: 0;
            left: 0;
            background: linear-gradient(315deg, transparent 50%, rgba(200, 164, 88, 0.3) 80%, rgba(245, 224, 163, 0.7) 100%);
            border-bottom-right-radius: 100%;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        .corner-hotspot:hover::after, .corner-hotspot:active::after {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Dynamic Shadow Shader Overlay during page flip */
        .spine-shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        /* Keyframes for smooth 3D Flip animation */
        @keyframes flipNextPage {
            0% {
                transform: rotateY(0deg);
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
            50% {
                box-shadow: -20px 0 50px rgba(0, 0, 0, 0.8);
            }
            100% {
                transform: rotateY(-180deg);
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
        }

        @keyframes flipPrevPage {
            0% {
                transform: rotateY(0deg);
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
            50% {
                box-shadow: 20px 0 50px rgba(0, 0, 0, 0.8);
            }
            100% {
                transform: rotateY(180deg);
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
        }

        .anim-flip-next {
            animation: flipNextPage 0.75s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
            transform-origin: left center;
        }

        .anim-flip-prev {
            animation: flipPrevPage 0.75s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
            transform-origin: right center;
        }

        /* Bookmark Ribbon Accent */
        .bookmark-ribbon {
            position: absolute;
            top: -2px;
            right: 24px;
            z-index: 28;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.7));
        }

        .bookmark-ribbon:hover {
            transform: translateY(2px);
        }

        /* Custom Scrollbar for Drawer */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #09080c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2218;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c8a458;
        }
    </style>
</head>
<body class="app-viewport flex flex-col justify-between select-none relative overflow-hidden">

    <!-- HEADER / NAVIGATION TITLE BAR -->
    <header class="w-full py-2.5 sm:py-3.5 px-4 sm:px-6 flex justify-between items-center z-20 pointer-events-auto bg-black/40 backdrop-blur-md border-b border-gold/10">
        <div class="flex items-center space-x-2 sm:space-x-3 truncate pr-2">
            <i class="fa-solid fa-book-bookmark text-gold text-sm sm:text-base"></i>
            <h1 class="text-gold text-xs sm:text-base tracking-wider font-cinzel font-semibold truncate">BESTIARIO</h1>
            <span class="text-[10px] sm:text-xs text-stone-400 font-cinzel hidden md:inline truncate">| Coplas a las Criaturas de Venezuela</span>
        </div>

        <div class="flex items-center space-x-1.5 sm:space-x-3 shrink-0">
            <!-- Bookmark Quick Toggle Button -->
            <button id="bookmarkBtn" onclick="toggleCurrentBookmark()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded border border-gold/30 hover:border-gold/80 bg-black/50 text-gold/80 hover:text-gold text-xs font-cinzel transition flex items-center space-x-1.5" title="Marcar esta página">
                <i id="bookmarkBtnIcon" class="fa-regular fa-bookmark text-xs"></i>
                <span class="hidden sm:inline">MARCADOR</span>
            </button>

            <!-- Grid / Index Button -->
            <button onclick="toggleIndexDrawer()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded border border-gold/30 hover:border-gold/80 bg-black/50 text-gold/80 hover:text-gold text-xs font-cinzel tracking-wider transition flex items-center space-x-1.5">
                <i class="fa-solid fa-list text-xs"></i>
                <span id="indexBtnLabel">ÍNDICE</span>
            </button>

            <!-- Fullscreen -->
            <button onclick="toggleFullScreen()" title="Pantalla Completa" class="p-1.5 sm:p-2 rounded border border-gold/20 hover:border-gold/60 bg-black/50 text-gold/70 hover:text-gold text-xs transition">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- MAIN STAGE / BOOK CONTAINER -->
    <main class="flex-1 flex items-center justify-center relative p-2 sm:p-4 stage-3d my-auto overflow-hidden">

        <!-- SINGLE VERTICAL PAGE FRAME (Aspect ratio approx 1:1.414) -->
        <div id="pageFrame" class="book-page-container relative w-full max-w-[460px] sm:max-w-[500px] aspect-[1/1.414] bg-dark-velvet rounded-md border border-gold/20 overflow-hidden flex flex-col justify-center items-center">
            
            <!-- ELEGANT GOLDEN CORNER BORDERS -->
            <div class="absolute top-2 left-2 w-3.5 h-3.5 sm:w-4 sm:h-4 border-t border-l border-gold/40 pointer-events-none z-10"></div>
            <div class="absolute top-2 right-2 w-3.5 h-3.5 sm:w-4 sm:h-4 border-t border-r border-gold/40 pointer-events-none z-10"></div>
            <div class="absolute bottom-2 left-2 w-3.5 h-3.5 sm:w-4 sm:h-4 border-b border-l border-gold/40 pointer-events-none z-10"></div>
            <div class="absolute bottom-2 right-2 w-3.5 h-3.5 sm:w-4 sm:h-4 border-b border-r border-gold/40 pointer-events-none z-10"></div>

            <!-- BOOKMARK VISUAL RIBBON -->
            <div id="bookmarkRibbon" onclick="toggleCurrentBookmark()" class="bookmark-ribbon hidden" title="Página marcada">
                <svg width="22" height="36" viewBox="0 0 22 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 0H22V36L11 28.5L0 36V0Z" fill="#C8A458"/>
                    <path d="M0 0H22V36L11 28.5L0 36V0Z" fill="url(#ribbon-grad)" fill-opacity="0.4"/>
                    <defs>
                        <linearGradient id="ribbon-grad" x1="11" y1="0" x2="11" y2="36" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFF5D6"/>
                            <stop offset="1" stop-color="#8A6D2F"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- ZOOMABLE WRAPPER LAYER -->
            <div id="zoomLayer" class="zoom-layer">
                <!-- BASE PAGE IMAGE (ACTIVE PAGE) -->
                <img id="activePageImage" 
                     src="Bestiario_cover_front.jpg" 
                     alt="Criaturas de Venezuela" 
                     class="w-full h-full object-contain pointer-events-none transition-opacity duration-200"
                     onerror="handleImageError(this)">

                <!-- FALLBACK CONTAINER IF LOCAL JPG NOT FOUND -->
                <div id="fallbackView" class="hidden absolute inset-0 flex-col items-center justify-center p-6 sm:p-8 text-center bg-[#110f14] border border-gold/20">
                    <i id="fallbackIcon" class="fa-solid fa-dragon text-4xl sm:text-5xl text-gold/40 mb-3 sm:mb-4"></i>
                    <h2 id="fallbackTitle" class="font-cinzel text-gold text-lg sm:text-xl mb-1 sm:mb-2">Bestiario</h2>
                    <p class="text-xs text-stone-400 max-w-xs font-garamond italic leading-relaxed">
                        Coloca la imagen <span class="text-gold/90 font-mono text-[11px]" id="fallbackFilename">Bestiario_cover_front.jpg</span> en la carpeta del proyecto para visualizar la ilustración completa.
                    </p>
                </div>
            </div>

            <!-- INTERACTIVE CORNER FLIP HOTSPOTS -->
            <div id="cornerBR" class="corner-hotspot corner-br" title="Siguiente página" onclick="nextPage()"></div>
            <div id="cornerBL" class="corner-hotspot corner-bl" title="Página anterior" onclick="prevPage()"></div>
            <div id="cornerTR" class="corner-hotspot corner-tr" title="Siguiente página" onclick="nextPage()"></div>
            <div id="cornerTL" class="corner-hotspot corner-tl" title="Página anterior" onclick="prevPage()"></div>

            <!-- SIDE CLICK NAVIGATION ZONES -->
            <div id="sideNext" class="absolute top-0 right-0 w-1/4 h-full z-10 cursor-pointer" onclick="nextPage()" title="Siguiente"></div>
            <div id="sidePrev" class="absolute top-0 left-0 w-1/4 h-full z-10 cursor-pointer" onclick="prevPage()" title="Anterior"></div>

            <!-- 3D FLIPPING PAGE LAYER -->
            <div id="flipLayer"></div>

            <!-- SHADOW SHADER OVERLAY -->
            <div id="spineShadow" class="spine-shadow-overlay"></div>
        </div>

    </main>

    <!-- DISCREET BOTTOM CONTROL BAR -->
    <footer class="w-full py-2.5 sm:py-3.5 px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center z-20 gap-2 sm:gap-3 border-t border-gold/10 bg-black/70 backdrop-blur-md">
        
        <!-- PREVIOUS BUTTON & ZOOM RESET -->
        <div class="flex items-center space-x-2">
            <button onclick="prevPage()" class="text-xs font-cinzel text-stone-400 hover:text-gold transition flex items-center space-x-1.5 px-2.5 py-1 rounded border border-gold/10 hover:border-gold/30 bg-black/40">
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                <span>ANTERIOR</span>
            </button>

            <!-- ZOOM CONTROLS -->
            <div class="flex items-center space-x-1 bg-black/40 border border-gold/10 rounded px-1.5 py-0.5">
                <button onclick="changeZoom(-0.25)" class="text-stone-400 hover:text-gold p-1 text-xs" title="Alejar (Zoom -)">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <span id="zoomLevelIndicator" class="text-[10px] font-mono text-gold/80 w-8 text-center">100%</span>
                <button onclick="changeZoom(0.25)" class="text-stone-400 hover:text-gold p-1 text-xs" title="Acercar (Zoom +)">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <button onclick="resetZoom()" class="text-stone-500 hover:text-gold p-1 text-[10px]" title="Restablecer Zoom">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- CENTER PAGE INDICATOR & SLIDER -->
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-center">
            <span id="pageIndicator" class="text-[11px] sm:text-xs font-cinzel tracking-widest text-gold/90 min-w-[110px] sm:min-w-[130px] text-center truncate">PORTADA</span>
            
            <input type="range" id="pageSlider" min="0" max="53" value="0" oninput="onSliderChange(this.value)" 
                   class="w-24 sm:w-36 accent-amber-600 bg-stone-900 h-1 rounded-lg cursor-pointer opacity-70 hover:opacity-100 transition">
        </div>

        <!-- NEXT BUTTON -->
        <button onclick="nextPage()" class="text-xs font-cinzel text-stone-400 hover:text-gold transition flex items-center space-x-1.5 px-2.5 py-1 rounded border border-gold/10 hover:border-gold/30 bg-black/40">
            <span>SIGUIENTE</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
    </footer>

    <!-- INDEX GRID MODAL / DRAWER -->
    <div id="indexOverlay" class="fixed inset-0 bg-black/80 z-40 hidden backdrop-blur-md transition-opacity opacity-0" onclick="toggleIndexDrawer()"></div>
    <div id="indexDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-[#0c0b0f] border-l border-gold/30 z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        
        <!-- DRAWER HEADER & TABS -->
        <div class="p-3.5 border-b border-gold/20 flex flex-col space-y-3 bg-black/60">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-compass text-gold text-sm"></i>
                    <h2 class="text-gold font-cinzel text-xs sm:text-sm tracking-wider uppercase">Índice del Bestiario</h2>
                </div>
                <button onclick="toggleIndexDrawer()" class="text-stone-400 hover:text-gold p-1 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- FILTER TABS: TODAS / MARCADORES -->
            <div class="flex border border-gold/20 rounded p-0.5 bg-black/40 text-xs font-cinzel">
                <button id="tabAllPages" onclick="switchDrawerTab('all')" class="flex-1 py-1 text-center rounded bg-gold/20 text-gold font-semibold transition">
                    TODAS (<span id="totalCountLabel">52</span>)
                </button>
                <button id="tabBookmarks" onclick="switchDrawerTab('bookmarks')" class="flex-1 py-1 text-center rounded text-stone-400 hover:text-gold transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-bookmark text-[10px] text-gold"></i>
                    <span>MARCADORES (<span id="bookmarkCountLabel">0</span>)</span>
                </button>
            </div>
        </div>

        <!-- THUMBNAIL GRID CONTAINER -->
        <div id="thumbnailGrid" class="flex-1 overflow-y-auto p-3.5 grid grid-cols-3 gap-2.5">
            <!-- Populated via JavaScript -->
        </div>
    </div>

    <!-- CORE LOGIC SCRIPT -->
    <script>
        /* ==========================================================================
           CONFIGURACIÓN MODULAR DEL LIBRO / MODULAR BOOK CONFIGURATION
           Ajusta estas variables para reutilizar este visor con cualquier otro libro.
           ========================================================================== */
        const BOOK_CONFIG = {
            // Título oficial de la obra
            title: "Bestiario - Coplas a las Criaturas de Venezuela",

            // Número total de páginas internas (excluyendo portada y contraportada)
            totalPages: 52,

            // Nombres de archivos para la portada (índice 0) y contraportada (índice totalPages + 1)
            frontCoverImage: "Bestiario_cover_front.jpg",
            backCoverImage: "Bestiario_cover_back.jpg",

            // Patrón de nombrado para las páginas internas.
            pagePrefix: "Bestiario_page-",
            pageExtension: ".jpg",
            pagePaddingLength: 4, // 0001, 0002...

            // Storage Key para guardar marcadores localmente
            storageKeyBookmarks: "bestiario_venezuela_bookmarks_v1",

            // Función generadora de rutas de imagen según el índice de página
            getPageFilename: function(index) {
                if (index === 0) return this.frontCoverImage;
                if (index === this.totalPages + 1) return this.backCoverImage;
                
                const paddedNum = String(index).padStart(this.pagePaddingLength, '0');
                return `${this.pagePrefix}${paddedNum}${this.pageExtension}`;
            }
        };

        /* ==========================================================================
           ESTADO GLOBAL Y CONTROL DE NAVEGACIÓN
           0 = Portada (Front Cover)
           1 a totalPages = Páginas internas
           totalPages + 1 = Contraportada (Back Cover)
           ========================================================================== */
        let currentPage = 0; 
        const maxIndex = BOOK_CONFIG.totalPages + 1;
        let isAnimating = false;
        let drawerTab = 'all'; // 'all' | 'bookmarks'

        // Cargar Marcadores desde LocalStorage
        let bookmarks = [];
        try {
            const saved = localStorage.getItem(BOOK_CONFIG.storageKeyBookmarks);
            if (saved) bookmarks = JSON.parse(saved);
        } catch(e) {
            bookmarks = [];
        }

        function saveBookmarks() {
            try {
                localStorage.setItem(BOOK_CONFIG.storageKeyBookmarks, JSON.stringify(bookmarks));
            } catch(e) {}
            updateBookmarkUI();
        }

        function toggleCurrentBookmark() {
            const idx = bookmarks.indexOf(currentPage);
            if (idx >= 0) {
                bookmarks.splice(idx, 1);
            } else {
                bookmarks.push(currentPage);
                bookmarks.sort((a,b) => a - b);
            }
            saveBookmarks();
            if (drawerTab === 'bookmarks') buildThumbnailGrid();
        }

        function updateBookmarkUI() {
            const isBookmarked = bookmarks.includes(currentPage);
            const btnIcon = document.getElementById('bookmarkBtnIcon');
            const ribbon = document.getElementById('bookmarkRibbon');

            if (isBookmarked) {
                btnIcon.className = "fa-solid fa-bookmark text-xs text-gold";
                ribbon.classList.remove('hidden');
            } else {
                btnIcon.className = "fa-regular fa-bookmark text-xs";
                ribbon.classList.add('hidden');
            }

            document.getElementById('bookmarkCountLabel').innerText = bookmarks.length;
        }

        /* ==========================================================================
           SISTEMA DE ZOOM Y PANEO INTERACTIVO
           ========================================================================== */
        let currentZoom = 1.0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        function applyZoomTransform() {
            const zoomLayer = document.getElementById('zoomLayer');
            zoomLayer.style.transform = `scale(${currentZoom}) translate(${panX}px, ${panY}px)`;
            document.getElementById('zoomLevelIndicator').innerText = `${Math.round(currentZoom * 100)}%`;

            // Toggle hotspot overlays when zoomed in to allow smooth pan/drag
            const pointerEvents = currentZoom > 1.05 ? 'none' : 'auto';
            ['cornerBR', 'cornerBL', 'cornerTR', 'cornerTL', 'sideNext', 'sidePrev'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.pointerEvents = pointerEvents;
            });
        }

        function changeZoom(delta) {
            currentZoom = Math.min(Math.max(1.0, currentZoom + delta), 3.0);
            if (currentZoom === 1.0) {
                panX = 0;
                panY = 0;
            }
            applyZoomTransform();
        }

        function resetZoom() {
            currentZoom = 1.0;
            panX = 0;
            panY = 0;
            applyZoomTransform();
        }

        // Mouse Drag / Touch Pan Implementation for Zoom Mode
        const pageFrame = document.getElementById('pageFrame');

        pageFrame.addEventListener('mousedown', (e) => {
            if (currentZoom > 1.05) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging && currentZoom > 1.05) {
                panX = (e.clientX - startX);
                panY = (e.clientY - startY);
                applyZoomTransform();
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Double click/tap zoom shortcut
        let lastTap = 0;
        pageFrame.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                if (currentZoom > 1.1) resetZoom();
                else changeZoom(0.75);
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        /* Preload images for instant rendering */
        function preloadNeighborImages(index) {
            if (index < maxIndex) {
                const imgNext = new Image();
                imgNext.src = BOOK_CONFIG.getPageFilename(index + 1);
            }
            if (index > 0) {
                const imgPrev = new Image();
                imgPrev.src = BOOK_CONFIG.getPageFilename(index - 1);
            }
        }

        // Return label string for current page
        function getPageLabel(index) {
            if (index === 0) return "PORTADA";
            if (index === maxIndex) return "CONTRAPORTADA";
            return `PÁGINA ${String(index).padStart(2, '0')} DE ${BOOK_CONFIG.totalPages}`;
        }

        // Update view & UI elements
        function updatePageDisplay(index) {
            resetZoom();
            const filename = BOOK_CONFIG.getPageFilename(index);
            const activeImg = document.getElementById('activePageImage');
            const fallbackView = document.getElementById('fallbackView');
            
            // Reset fallback state
            activeImg.style.display = 'block';
            fallbackView.classList.add('hidden');

            activeImg.src = filename;

            // Update page controls
            document.getElementById('pageIndicator').innerText = getPageLabel(index);
            document.getElementById('pageSlider').value = index;

            preloadNeighborImages(index);
            updateBookmarkUI();
            highlightCurrentThumbnail(index);
        }

        // Fallback view when local JPG is missing
        function handleImageError(imgElement) {
            imgElement.style.display = 'none';
            const fallbackView = document.getElementById('fallbackView');
            const filename = BOOK_CONFIG.getPageFilename(currentPage);
            const icon = document.getElementById('fallbackIcon');

            if (currentPage === 0) {
                document.getElementById('fallbackTitle').innerText = "Portada";
                icon.className = "fa-solid fa-book text-4xl sm:text-5xl text-gold/40 mb-3";
            } else if (currentPage === maxIndex) {
                document.getElementById('fallbackTitle').innerText = "Contraportada";
                icon.className = "fa-solid fa-book-journal-whills text-4xl sm:text-5xl text-gold/40 mb-3";
            } else {
                document.getElementById('fallbackTitle').innerText = `Criatura ${currentPage}`;
                icon.className = "fa-solid fa-dragon text-4xl sm:text-5xl text-gold/40 mb-3";
            }

            document.getElementById('fallbackFilename').innerText = filename;
            fallbackView.classList.remove('hidden');
            fallbackView.classList.add('flex');
        }

        function nextPage() {
            if (currentPage >= maxIndex || isAnimating) return;
            isAnimating = true;

            const flipLayer = document.getElementById('flipLayer');
            const currentFilename = BOOK_CONFIG.getPageFilename(currentPage);
            const nextFilename = BOOK_CONFIG.getPageFilename(currentPage + 1);

            flipLayer.innerHTML = `
                <div class="flipping-page anim-flip-next">
                    <div class="flipping-face">
                        <img src="${currentFilename}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                    <div class="flipping-face flipping-back">
                        <img src="${nextFilename}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                </div>
            `;

            setTimeout(() => {
                currentPage++;
                updatePageDisplay(currentPage);
            }, 370);

            setTimeout(() => {
                flipLayer.innerHTML = '';
                isAnimating = false;
            }, 750);
        }

        function prevPage() {
            if (currentPage <= 0 || isAnimating) return;
            isAnimating = true;

            const flipLayer = document.getElementById('flipLayer');
            const currentFilename = BOOK_CONFIG.getPageFilename(currentPage);
            const prevFilename = BOOK_CONFIG.getPageFilename(currentPage - 1);

            flipLayer.innerHTML = `
                <div class="flipping-page anim-flip-prev">
                    <div class="flipping-face">
                        <img src="${currentFilename}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                    <div class="flipping-face flipping-back">
                        <img src="${prevFilename}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                    </div>
                </div>
            `;

            setTimeout(() => {
                currentPage--;
                updatePageDisplay(currentPage);
            }, 370);

            setTimeout(() => {
                flipLayer.innerHTML = '';
                isAnimating = false;
            }, 750);
        }

        // Slider control input
        function onSliderChange(val) {
            currentPage = parseInt(val);
            updatePageDisplay(currentPage);
        }

        // Direct page jump from Index Drawer
        function jumpToPage(pageNum) {
            currentPage = pageNum;
            updatePageDisplay(currentPage);
            toggleIndexDrawer();
        }

        function toggleIndexDrawer() {
            const overlay = document.getElementById('indexOverlay');
            const drawer = document.getElementById('indexDrawer');

            if (drawer.classList.contains('translate-x-full')) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                drawer.classList.remove('translate-x-full');
                buildThumbnailGrid();
            } else {
                overlay.classList.add('opacity-0');
                drawer.classList.add('translate-x-full');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function switchDrawerTab(tab) {
            drawerTab = tab;
            const tabAll = document.getElementById('tabAllPages');
            const tabBM = document.getElementById('tabBookmarks');

            if (tab === 'all') {
                tabAll.className = "flex-1 py-1 text-center rounded bg-gold/20 text-gold font-semibold transition";
                tabBM.className = "flex-1 py-1 text-center rounded text-stone-400 hover:text-gold transition flex items-center justify-center space-x-1";
            } else {
                tabBM.className = "flex-1 py-1 text-center rounded bg-gold/20 text-gold font-semibold transition flex items-center justify-center space-x-1";
                tabAll.className = "flex-1 py-1 text-center rounded text-stone-400 hover:text-gold transition";
            }
            buildThumbnailGrid();
        }

        // Build drawer thumbnail grid
        function buildThumbnailGrid() {
            const grid = document.getElementById('thumbnailGrid');
            let html = '';
            
            const getSvgFallback = (label) => `data:image/svg+xml,%3CSVG%20xmlns='http://www.w3.org/2000/svg'%20width='100'%20height='140'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23111115'/%3E%3Ctext%20x='50%25'%20y='50%25'%20fill='%23c8a458'%20font-size='12'%20text-anchor='middle'%20dominant-baseline='middle'%3E${encodeURIComponent(label)}%3C/text%3E%3C/SVG%3E`;

            const pagesToRender = drawerTab === 'all' 
                ? Array.from({length: maxIndex + 1}, (_, i) => i)
                : bookmarks;

            if (pagesToRender.length === 0 && drawerTab === 'bookmarks') {
                grid.innerHTML = `
                    <div class="col-span-3 py-12 text-center text-stone-500 font-garamond italic text-sm">
                        <i class="fa-regular fa-bookmark text-2xl mb-2 text-gold/30 block"></i>
                        No has añadido marcadores aún.
                    </div>
                `;
                return;
            }

            pagesToRender.forEach(i => {
                const filename = BOOK_CONFIG.getPageFilename(i);
                let label = `${i}`;
                if (i === 0) label = "Portada";
                if (i === maxIndex) label = "Contraportada";

                const isBM = bookmarks.includes(i);

                html += `
                    <button id="thumb-${i}" onclick="jumpToPage(${i})" class="p-1 bg-black/60 hover:bg-black/90 border border-gold/20 hover:border-gold/80 rounded transition group flex flex-col items-center relative">
                        ${isBM ? '<i class="fa-solid fa-bookmark text-gold text-[10px] absolute top-2 right-2 z-10 drop-shadow"></i>' : ''}
                        <div class="w-full aspect-[1/1.4] bg-stone-900 rounded overflow-hidden relative mb-1 border border-stone-800">
                            <img src="${filename}" alt="${label}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${getSvgFallback(label)}';">
                        </div>
                        <span class="text-[10px] font-cinzel text-stone-400 group-hover:text-gold truncate w-full text-center">${label}</span>
                    </button>
                `;
            });

            grid.innerHTML = html;

            // Update bounds & counts
            const slider = document.getElementById('pageSlider');
            slider.min = 0;
            slider.max = maxIndex;

            document.getElementById('totalCountLabel').innerText = BOOK_CONFIG.totalPages;
            document.getElementById('bookmarkCountLabel').innerText = bookmarks.length;
            highlightCurrentThumbnail(currentPage);
        }

        function highlightCurrentThumbnail(index) {
            for (let i = 0; i <= maxIndex; i++) {
                const el = document.getElementById(`thumb-${i}`);
                if (el) {
                    if (i === index) {
                        el.classList.add('border-gold', 'bg-gold/15');
                    } else {
                        el.classList.remove('border-gold', 'bg-gold/15');
                    }
                }
            }
        }

        // Fullscreen Toggle
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        let touchStartX = 0;
        let touchEndX = 0;

        document.getElementById('pageFrame').addEventListener('touchstart', (e) => {
            if (currentZoom <= 1.05 && e.touches.length === 1) {
                touchStartX = e.changedTouches[0].screenX;
            }
        }, { passive: true });

        document.getElementById('pageFrame').addEventListener('touchend', (e) => {
            if (currentZoom <= 1.05 && e.changedTouches.length === 1) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }
        }, { passive: true });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 45) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        }

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                prevPage();
            } else if (e.key === 'b' || e.key === 'B') {
                toggleCurrentBookmark();
            }
        });

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            updatePageDisplay(currentPage);
        });
    </script>
</body>
</html>
